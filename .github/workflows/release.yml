# Builds the installer package for GitHub Releases (docs/RELEASE.md "CI").
#   push of a v* tag    build, sign, notarize, smoke test, attest, then publish the release
#   workflow_dispatch   the same build as a dry run: the package is only uploaded as a workflow artifact
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# One release run per ref at a time, and never cancel one halfway through notarizing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # GitHub's `bash` shell plus -u.
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    # macOS 27 on arm64. macos-latest only has Xcode 26.
    runs-on: xcode-27
    # The signing and notary secrets live in this environment, behind a required reviewer.
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write       # attestation: Sigstore signing certificate
      attestations: write   # attestation: store it on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image default is 27.1. On older images Xcode_27.2.app is the release candidate (27B48), not the build the
      # developer tests with. If this step fails, the job landed on an older image: re-run it.
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          version=$(xcodebuild -version)
          echo "$version"
          [[ "$version" == *"Build version 27B52"* ]] || { echo "::error::need Xcode 27.2 (27B52): re-run"; exit 1; }

      - name: Test
        run: swift test

      # The signing material is written here, not by the action (which would leave its own copy of the .p12 in a temp
      # file), and deleted right after release.sh.
      - name: Write the signing certificates and the notary API key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          [[ -s "$RUNNER_TEMP/developer-id.p12" ]] || { echo "::error::the Developer ID .p12 is empty"; exit 1; }
          [[ -s "$RUNNER_TEMP/AuthKey.p8" ]] || { echo "::error::the notary API key is empty"; exit 1; }

      # One .p12 with both Developer ID identities (Application and Installer). The action puts them in a temporary,
      # unlocked keychain (signing_temp) on the search list and deletes it when the job ends. INSOMNIA_SIGN_KEYCHAIN
      # stays unset. Keep only the current certificates in the .p12: two with the same name make codesign fail.
      - name: Import the signing certificates
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-filepath: ${{ runner.temp }}/developer-id.p12
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      # RELEASE_TAG is set only for a tag push; release.sh then requires it to be v + the bundle version.
      - name: Build, sign, notarize and package
        env:
          NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: scripts/release.sh

      # Nothing after this signs. Locked, not deleted: the import action's own post step deletes the keychain and fails
      # the job if it is already gone.
      - name: Delete the signing material and lock the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
          security lock-keychain signing_temp.keychain || true

      # Install the package on this throwaway runner the way a user would, then check what landed: signatures, the
      # daemon plist, root ownership. Installer must leave /Applications itself alone.
      - name: Smoke test the installer
        id: smoke
        run: |
          pkg="dist/Insomnia-$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist).pkg"
          [[ -f "$pkg" ]] || { echo "::error::release.sh didn't write $pkg"; exit 1; }
          before=$(stat -f '%Su:%Sg %Sp' /Applications)
          sudo installer -pkg "$pkg" -target /
          pkgutil --pkg-info com.gdeml.Insomnia.pkg
          scripts/lid-verify.sh --staged /Applications/Insomnia.app
          after=$(stat -f '%Su:%Sg %Sp' /Applications)
          echo "/Applications before: $before, after: $after"
          [[ "$after" == "$before" ]] || { echo "::error::the installer changed /Applications to $after"; exit 1; }
          [[ "$after" == "root:admin drwxrwxr-x" ]] || echo "::warning::/Applications on this image is $after"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Show the install log
        if: failure() && steps.smoke.outcome == 'failure'
        run: sudo tail -n 200 /var/log/install.log

      # attest-build-provenance v4 is a wrapper around actions/attest; this is the same SLSA build provenance.
      # Tag builds only: a dry run's package must not pass `gh attestation verify` as a release.
      - name: Attest the package
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.smoke.outputs.pkg }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    # Tag pushes only. A workflow_dispatch run stays a dry run even when started from a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    # No Apple secrets here, only the token that can create the release.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Insomnia $version" \
              --generate-notes "dist/Insomnia-$version.pkg" dist/SHA256SUMS.txt
