# Build and test on pushes to main and on pull requests (docs/RELEASE.md "CI"). No secrets, no signing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # GitHub's `bash` shell plus -u.
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  test:
    # macOS 27 on arm64. macos-latest only has Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image default is 27.1. Older images still have the 27.2 release candidate here, which is fine for CI;
      # the release workflow insists on the final build.
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      # The configuration build.sh ships; swift test below covers debug.
      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
